name: Deploy NH PSX Super Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir app
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          unzip -q "$ZIP" -d app

      - name: Find project
        run: |
          PROJECT=$(find app -name package.json -printf '%h\n' | head -1)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: ${{ env.PROJECT }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.PROJECT }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
