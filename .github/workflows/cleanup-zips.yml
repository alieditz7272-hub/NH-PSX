name: Clean Old ZIP Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all ZIP files
        run: |
          # Delete tracked ZIP files
          git ls-files -z | grep -z -Ei '\.zip$' | xargs -0 -r git rm -f

          # Delete any untracked ZIP files too
          find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -delete

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No ZIP files found."
          else
            git commit -m "Remove all old ZIP files"
            git push
          fi
